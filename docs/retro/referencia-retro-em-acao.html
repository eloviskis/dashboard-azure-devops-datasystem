<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retro em ação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Exo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F7; --surface:#FFFFFF; --surface-2:#F4F8FB; --ink:#002C4D; --muted:#4C6880; --line:#D2DEE8;
  --accent:#0078AA; --on-accent:#FFFFFF; --primary:#5ABC36; --on-primary:#002C4D; --navy:#002C4D;
  --ok:#2E8A1E; --warn:#A75A06; --bad:#B3261E;
  --n0:#FFE38A; --n1:#C6EBB4; --n2:#B8E2F4; --n3:#BDEBE5; --n4:#F7CBA9; --note-ink:#14273A;
  --ts:65%; --tl:90%; --tk:24%;
  --shadow:0 1px 0 rgba(0,44,77,.06), 0 8px 18px -12px rgba(0,44,77,.4);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#002C4D; --surface:#06375C; --surface-2:#033154; --ink:#EAF2F8; --muted:#9DB8CC; --line:#1B4A6E;
    --accent:#4FB6E6; --on-accent:#00213B; --primary:#5ABC36; --on-primary:#002C4D; --navy:#00223D;
    --ok:#7AD45A; --warn:#F2A541; --bad:#FF8A80;
    --n0:#E8CB6A; --n1:#A6D893; --n2:#94CBE4; --n3:#9ED6CF; --n4:#E3AE86;
    --ts:28%; --tl:24%; --tk:86%;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 20px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#002C4D; --surface:#06375C; --surface-2:#033154; --ink:#EAF2F8; --muted:#9DB8CC; --line:#1B4A6E;
  --accent:#4FB6E6; --on-accent:#00213B; --primary:#5ABC36; --on-primary:#002C4D; --navy:#00223D;
  --ok:#7AD45A; --warn:#F2A541; --bad:#FF8A80;
  --n0:#E8CB6A; --n1:#A6D893; --n2:#94CBE4; --n3:#9ED6CF; --n4:#E3AE86;
  --ts:28%; --tl:24%; --tk:86%;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 20px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
h1,h2,h3{font-family:"Exo 2","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.15;margin:0}
h1{font-size:clamp(1.7rem,3.2vw,2.3rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1260px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;border-bottom:3px solid var(--primary);overflow:hidden}
.waves{position:absolute;right:-30px;top:-20px;width:min(620px,60vw);height:120px;pointer-events:none;opacity:.5}
.top-in{position:relative;z-index:1;display:flex;align-items:center;gap:20px;min-height:68px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{font-family:"Exo 2",system-ui,sans-serif;font-weight:800;font-size:1.15rem;color:#fff;text-decoration:none;display:flex;align-items:center;gap:14px}
.brand img{height:40px;width:auto;display:block}
.brand-sep{width:1px;height:30px;background:rgba(255,255,255,.35)}
#nav{display:flex;gap:4px;flex:1;overflow-x:auto}
#nav a{padding:8px 14px;border-radius:999px;color:rgba(255,255,255,.75);text-decoration:none;font-weight:700;white-space:nowrap}
#nav a:hover{color:#fff;background:rgba(255,255,255,.1)}
#nav a[aria-current="page"]{background:var(--primary);color:var(--on-primary)}
#nav a:focus-visible,.top .btn:focus-visible{outline-color:#fff}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--primary);color:var(--on-primary);font-size:.75rem}
#nav a[aria-current="page"] .badge{background:var(--navy);color:#fff}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent}
.btn.danger:hover{border-color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
.fld > span{font-weight:700}
input[type=text],input[type=date],input:not([type]),select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:.95rem}
textarea{resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}

/* bar */
#bar{padding-top:18px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.filters .grow{flex:1}
.filters select,.filters input{width:auto;min-width:180px}

main{padding-top:22px;padding-bottom:64px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head > div{flex:1;min-width:240px}
.sub{color:var(--muted);margin-top:6px}
.count{display:inline-block;margin-left:8px;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:.85rem;font-weight:700;color:var(--muted)}
.hint{color:var(--muted);font-size:.93rem}
.notice{border:1px solid var(--line);background:var(--surface);border-left:4px solid var(--warn);padding:10px 14px;border-radius:8px;margin-bottom:16px}
.empty{border:2px dashed var(--line);border-radius:12px;padding:36px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:6px}
.empty .btn{margin-top:14px}

/* tags */
.tag{--h:220;display:inline-block;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:700;background:hsl(var(--h) var(--ts) var(--tl));color:hsl(var(--h) 45% var(--tk));white-space:nowrap}
.rlink{font-size:.82rem;color:var(--muted)}
.by{font-size:.78rem;color:var(--muted)}

/* validation queue */
.validate{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:28px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{margin-right:auto}
.sec-head .hint{flex-basis:100%}
.sug-list{display:grid;gap:14px}
.sug{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface-2);display:grid;gap:10px;border-left:5px solid var(--line)}
.sug.pri-alta{border-left-color:var(--bad)} .sug.pri-media{border-left-color:var(--warn)}
.sug-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sug-title{font-weight:700;font-size:1.05rem}
.sug-row{display:grid;grid-template-columns:minmax(160px,1.3fr) minmax(230px,1.3fr) minmax(110px,.7fr) auto;gap:10px;align-items:end}
.sug-btns{display:flex;gap:8px}
.sug-ro h3{font-size:1.05rem}
.origins{display:flex;flex-wrap:wrap;gap:8px}
.mini-note{background:var(--n0);color:var(--note-ink);font-size:.85rem;padding:6px 10px;border-radius:2px 2px 8px 2px;max-width:100%;box-shadow:var(--shadow);white-space:pre-line}

/* kanban */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:stretch}
.lane{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:220px;transition:border-color .15s,background .15s}
.lane.over{border:2px dashed var(--accent);padding:13px}
.lane-hint{font-size:.82rem;color:var(--muted);margin:-6px 0 12px}
.items li{display:flex;flex-direction:column}
.items li[draggable="true"]{cursor:grab}
.items li.dragging{opacity:.45}
.item-acts{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.btn.sm{padding:4px 10px;font-size:.82rem;border-radius:6px}
.due-wrap{display:flex;gap:6px}
.due-wrap input{flex:1;min-width:0}
.due-wrap input:disabled{opacity:.45}
.rec{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px;font-weight:700;font-size:.82rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.rec:hover{border-color:var(--muted)}
.rec[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.recur{font-weight:700;color:var(--accent)}
.ttag{--h:200;display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:4px;font-size:.76rem;font-weight:700;border:1px solid hsl(var(--h) 55% 45% / .6);color:hsl(var(--h) 55% var(--tk));background:transparent;white-space:nowrap}
.ttag::before{content:"";width:7px;height:7px;border-radius:2px;background:hsl(var(--h) 62% 50%)}
.tpick{display:flex;flex-wrap:wrap;gap:6px}
button.ttag{cursor:pointer;font:inherit;font-size:.8rem;font-weight:700;padding:3px 9px;border-style:dashed;color:var(--muted)}
button.ttag[aria-pressed="true"]{border-style:solid;color:hsl(var(--h) 55% var(--tk));background:hsl(var(--h) var(--ts) var(--tl))}
.tag-rows{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tag-rows li{display:grid;grid-template-columns:1fr 160px auto;gap:8px;align-items:center}
.tbars{display:grid;gap:6px}
.tbar{display:grid;grid-template-columns:130px 1fr 28px;gap:8px;align-items:center;font-size:.85rem}
.tbar .bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.tbar .bar i{display:block;height:100%;background:hsl(var(--h) 62% 50%)}
.tbar b{text-align:right}
.lane-h{display:flex;align-items:center;gap:8px;font-size:1.05rem;margin-bottom:12px}
.lane-h::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--muted)}
.lane-andamento .lane-h::before{background:var(--warn)}
.lane-validacao .lane-h::before{background:var(--accent)}
.lane-concluida .lane-h::before{background:var(--ok)}
.items{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{width:100%;text-align:left;display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer}
.item:hover{border-color:var(--muted)}
.item.pri-alta{border-left-color:var(--bad)} .item.pri-media{border-left-color:var(--warn)}
.item-title{font-weight:700;line-height:1.3}
.lane-concluida .item-title{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.item-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.83rem;color:var(--muted)}
.owner{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:700}
.owner.none{color:var(--warn)}
.ini{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:.68rem;font-weight:700;background:hsl(var(--h,220) var(--ts) var(--tl));color:hsl(var(--h,220) 45% var(--tk))}
.late .due{color:var(--bad);font-weight:700}
.lane-empty{color:var(--muted);font-size:.9rem;padding:8px 2px}
.more{margin-top:10px}
details.disc{margin-top:28px}
details.disc summary{cursor:pointer;color:var(--muted);font-weight:700}
.disc ul{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.disc li{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}

/* retros list */
.team-group{margin-bottom:28px}
.team-group > h2{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rrows{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.rrows li + li{border-top:1px solid var(--line)}
.rrow{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px;text-decoration:none;color:var(--ink)}
.rrow:hover{background:var(--surface-2)}
.rdate{font-family:"Exo 2",system-ui,sans-serif;font-weight:800;font-size:1.15rem}
.rdate.none{font-size:.85rem;color:var(--muted);font-family:inherit;font-weight:700}
.rtitle{font-weight:700}
.rsub{display:block;font-weight:400;color:var(--muted);font-size:.86rem}
.rstat{font-size:.86rem;color:var(--muted);text-align:right}
.rstat b{color:var(--ink)}

/* retro detail */
.back{display:inline-block;margin-bottom:14px;font-weight:700;text-decoration:none}
.meta-line{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;color:var(--muted);margin-top:8px}
.meta-edit{display:grid;grid-template-columns:1fr 2fr 160px auto;gap:10px;align-items:end;margin:14px 0;background:var(--surface);padding:14px;border:1px solid var(--line);border-radius:12px}
.insights{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin:22px 0}
.resumo{font-size:1.06rem;max-width:75ch;margin-bottom:16px}
.ins-grid{display:grid;grid-template-columns:2fr 1fr;gap:24px}
.ins-grid h3{margin-bottom:8px}
.themes,.kudos{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.themes li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline}
.tone{font-size:.74rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.tone.positivo{color:var(--ok)} .tone.atencao{color:var(--warn)} .tone.critico{color:var(--bad)}
.themes .tdet{grid-column:2;color:var(--muted);font-size:.9rem}
.kudos li{padding-left:14px;position:relative}
.kudos li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--n2)}
.busy{margin-top:12px;color:var(--accent);font-weight:700}
.retro-board{display:flex;gap:18px;overflow-x:auto;padding:6px 2px 18px;scroll-snap-type:x proximity}
.rcol{flex:0 0 280px;scroll-snap-align:start}
.rcol-h{display:flex;align-items:center;gap:8px}
.swatch{width:14px;height:14px;border-radius:2px 2px 5px 2px;flex:none}
.rcol-d{color:var(--muted);font-size:.85rem;margin:6px 0 12px;min-height:2.4em}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.note{color:var(--note-ink);padding:12px 13px 10px;border-radius:2px 2px 14px 2px;box-shadow:var(--shadow);transform:rotate(var(--r,0deg))}
.n0{background:var(--n0)} .n1{background:var(--n1)} .n2{background:var(--n2)} .n3{background:var(--n3)} .n4{background:var(--n4)}
.note-t{white-space:pre-line;overflow-wrap:anywhere;font-size:.95rem}
.note hr{border:0;border-top:1px dashed rgba(42,36,25,.35);margin:8px 0}
.note-c{list-style:none;margin:8px 0 0;padding:8px 0 0;border-top:1px solid rgba(42,36,25,.18);font-size:.84rem;display:grid;gap:4px;overflow-wrap:anywhere}
.note-c li::before{content:"↳ "}
.note-f{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.votes{font-size:.78rem;font-weight:700;background:rgba(42,36,25,.12);padding:1px 8px;border-radius:999px}
.note-btn{border:0;background:rgba(42,36,25,.1);color:var(--note-ink);font-weight:700;font-size:.8rem;padding:4px 9px;border-radius:6px;cursor:pointer}
.note-btn:hover{background:rgba(42,36,25,.2)}
.ract{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.ract li button{width:100%;text-align:left;display:flex;gap:12px;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.st{font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap}
.st.concluida{color:var(--ok)} .st.andamento{color:var(--warn)} .st.sugerida{color:var(--accent)} .st.validacao{color:var(--accent)}
.danger-zone{margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}

/* teams */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px;align-content:start}
.tcard-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tcard-h h2{font-size:1.5rem}
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.num{background:var(--surface-2);border-radius:10px;padding:8px;min-width:0}
.num b{display:block;font-family:"Exo 2",system-ui,sans-serif;font-size:1.5rem;line-height:1.1}
.num span{display:block;font-size:.74rem;line-height:1.2;color:var(--muted)}
.num.bad b{color:var(--bad)}
.progress{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--ok)}
.fb{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.fb-msg{font-size:1rem;max-width:70ch}
.fb ul{margin:0;padding-left:18px}
.fb h3{font-size:.95rem}
.fb-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100dvh - 40px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(12,16,24,.55)}
.dlg{display:grid;gap:16px;padding:22px;overflow:auto;max-height:calc(100dvh - 42px)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dlg-row{display:grid;grid-template-columns:1fr 1fr 1.5fr .9fr;gap:10px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.dlg-f .left{margin-right:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:fit-content;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.log li{border-left:3px solid var(--line);padding:2px 0 2px 12px}
.log .who{font-size:.8rem;color:var(--muted)}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;cursor:pointer;background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop strong{color:var(--accent)}
.imp-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.imp{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.imp-row{display:grid;grid-template-columns:1fr 1.6fr 150px auto;gap:10px;align-items:end}
.imp .cols{display:flex;flex-wrap:wrap;gap:6px}
.imp .err{color:var(--bad)}
.imp .warn{color:var(--warn);font-size:.88rem}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:700;max-width:min(560px,calc(100vw - 32px));opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}

@media (max-width:900px){
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ins-grid,.fb-cols{grid-template-columns:1fr}
  .sug-row{grid-template-columns:1fr 1fr}
  .sug-btns{grid-column:1/-1;justify-content:flex-end}
  .dlg-row{grid-template-columns:1fr 1fr}
  .meta-edit,.imp-row{grid-template-columns:1fr 1fr}
  .teams{grid-template-columns:1fr}
}
@media (max-width:560px){
  .brand img{height:32px}
  .brand-sep{display:none}
  .wrap{padding:0 14px}
  .rrow{grid-template-columns:64px 1fr}
  .rstat{grid-column:2;text-align:left}
  .filters select,.filters input{min-width:0;width:100%}
  .nums{grid-template-columns:repeat(3,1fr)}
  .board{grid-template-columns:1fr}
  #btnImport{width:100%;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.note{transform:none}}
</style>

<script>
"use strict";
/* ---------- constants ---------- */
const XLSX_SRC = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
const PDF_SRC = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFW_SRC = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const PRI = {alta:"Alta", media:"Média", baixa:"Baixa"};
const PRI_ORDER = {alta:0, media:1, baixa:2};
const STATE = {sugerida:"Sugestão", aberta:"A fazer", andamento:"Em andamento", validacao:"Validar", concluida:"Fechada", descartada:"Descartada"};
const LIVE = ["aberta","andamento","validacao","concluida"];
const TONE = {positivo:"Positivo", atencao:"Atenção", critico:"Crítico"};
const ROT = [-1.1, .7, -.4, 1, -.7, .3, -.2, .9];

/* ---------- state ---------- */
const S = {
  view:"acoes", openRetro:null, team:"all", owner:"all", q:"",
  retros:[], actions:[], teams:{}, ready:{}, loading:true, stale:false, noDb:false,
  canWrite:true, canValidate:false, myId:null, names:{}, asked:new Set(),
  tags:[], tagF:"all",
  drafts:{}, busy:{}, showAllDone:false, editMeta:null, dirty:false, barSig:"", imp:null
};
let db=null, user=null, sample=null;
const chains = {};

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
function h(tag, props, ...kids){
  const el = document.createElement(tag); let val;
  if(props) for(const k in props){
    const v = props[k];
    if(v==null || v===false) continue;
    if(k==="class") el.className = v;
    else if(k==="value") val = v;
    else if(k==="checked"||k==="selected"||k==="disabled"||k==="open"||k==="hidden") el[k] = !!v;
    else if(k.startsWith("on") && typeof v==="function") el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v===true ? "" : String(v));
  }
  for(const c of kids.flat(Infinity)){
    if(c==null || c===false || c==="") continue;
    el.append(c instanceof Node ? c : String(c));
  }
  if(val!==undefined) el.value = val;
  return el;
}
const norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const slug = s => norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "x";
const nowIso = () => new Date().toISOString();
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function newId(base){ return `${slug(base).slice(0,40)}-${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}`; }
function hue(s){ let x=0; for(const ch of norm(s)) x=(x*31+ch.charCodeAt(0))>>>0; return x%360; }
function fmtDate(d, long){
  if(!d) return ""; const [y,m,dd]=d.split("-");
  if(!m) return d;
  return (long || y!==String(new Date().getFullYear())) ? `${dd}/${m}/${y}` : `${dd}/${m}`;
}
const arr = x => Array.isArray(x) ? x : [];
const isLate = a => !a.recurring && a.due && a.due < todayStr() && (a.state==="aberta"||a.state==="andamento");
const initials = n => String(n||"?").split(/\s+|,|\be\b/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("") || "?";
function teamTag(name){ return name ? h("span",{class:"tag",style:`--h:${hue(name)}`}, name) : null; }
function retroOf(id){ return S.retros.find(r=>r.id===id); }
function retroLink(id){ const r=retroOf(id); return r ? h("a",{class:"rlink",href:"#retro-"+r.id}, `Retro ${r.title}`) : null; }
function personName(id){ if(id==="claude") return "Claude"; return S.names[id] || "Alguém"; }
function statsOf(cols){ let cards=0,votes=0,comments=0; for(const c of arr(cols)) for(const k of arr(c.cards)){ cards++; votes+=k.v||0; comments+=arr(k.c).length; } return {cards,votes,comments}; }
function field(label, input){ return h("label",{class:"fld"}, h("span",null,label), input); }
function dueField(d, ro){
  const date = h("input",{type:"date",value:d.recurring ? "" : d.due,disabled:ro||d.recurring,"aria-label":"Prazo",oninput:e=>d.due=e.target.value});
  const btn = h("button",{type:"button",class:"rec",disabled:ro,"aria-pressed":String(!!d.recurring),title:"Ação que sempre tem que ser feita, sem data",
    onclick:()=>{ d.recurring=!d.recurring; if(d.recurring){ d.due=""; date.value=""; } date.disabled = ro || d.recurring; btn.setAttribute("aria-pressed", String(d.recurring)); }}, "↻ Recorrente");
  return h("div",{class:"fld"}, h("span",null,"Prazo"), h("div",{class:"due-wrap"}, date, btn));
}
function select(map, value, onChange, attrs={}){
  return h("select",{...attrs, onchange:e=>onChange(e.target.value)}, Object.entries(map).map(([k,v])=>h("option",{value:k, selected:k===value}, v)));
}
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"), 3800); }
function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${src}"]`)?.dataset.ok) return res();
    const s=document.createElement("script"); s.src=src; s.onload=()=>{s.dataset.ok="1";res();}; s.onerror=()=>rej(new Error("Não foi possível carregar o leitor de arquivos.")); document.head.append(s);
  });
}
function write(path, fn){
  const p = (chains[path]||Promise.resolve()).then(fn).then(()=>true, e=>{ writeErr(e); return false; });
  chains[path] = p; return p;
}
function writeErr(e){
  const c = e && e.code;
  if(c==="invalid_argument"){ toast("Não foi possível salvar. Seu acesso a este painel pode ser só de leitura."); }
  else if(c==="quota_exceeded") toast("O espaço de dados do painel está cheio. Exclua retros antigas para liberar espaço.");
  else if(c==="resource_exhausted") toast("Muitas alterações seguidas. Aguarde alguns segundos e tente de novo.");
  else toast("Não foi possível salvar agora. Tente de novo em instantes.");
}
function sampleErr(e){
  const c = e && e.code;
  if(c==="not_granted") return "A IA não foi autorizada nesta visita. Recarregue a página para autorizar.";
  if(c==="rate_limited") return "Muitas chamadas à IA seguidas. Tente de novo em um minuto.";
  if(c==="invalid_json") return "A resposta da IA veio incompleta. Tente de novo.";
  return "A IA não respondeu agora. Tente de novo em instantes.";
}

/* ---------- derived ---------- */
function teamList(){
  const m = new Map();
  for(const r of [...S.retros].sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)))) if(r.team) m.set(slug(r.team), r.team);
  for(const a of S.actions) if(a.team && !m.has(slug(a.team))) m.set(slug(a.team), a.team);
  return [...m.entries()].sort((a,b)=>a[1].localeCompare(b[1],"pt-BR"));
}
function splitOwners(s){ return String(s||"").split(/,|\/|;|\s+e\s+|\s*&\s*/).map(x=>x.trim()).filter(Boolean); }
function ownerList(){
  const m = new Map();
  for(const a of S.actions) for(const n of splitOwners(a.owner)) if(!m.has(norm(n))) m.set(norm(n), n);
  return [...m.values()].sort((a,b)=>a.localeCompare(b,"pt-BR"));
}
const passTeam = x => S.team==="all" || slug(x.team)===S.team;
function passOwner(a){
  if(S.owner==="all") return true;
  if(S.owner==="__none") return !String(a.owner||"").trim();
  return splitOwners(a.owner).some(n=>norm(n)===S.owner);
}
function passQuery(a){
  if(!S.q.trim()) return true; const q=norm(S.q);
  return [a.title,a.detail,a.owner,a.team,...arr(a.origin),...arr(a.tags).map(id=>(tagOf(id)||{}).name)].some(t=>norm(t).includes(q));
}
function tagList(){ return [...S.tags].sort((a,b)=>(a.order??99)-(b.order??99) || String(a.name).localeCompare(String(b.name),"pt-BR")); }
function tagOf(id){ return S.tags.find(t=>t.id===id); }
function tagChips(ids){ return arr(ids).map(tagOf).filter(Boolean).map(t=>h("span",{class:"ttag",style:`--h:${t.hue??200}`}, t.name)); }
function tagPicker(d, ro){
  const box = h("div",{class:"tpick",role:"group","aria-label":"Tipo da ação"});
  const draw = () => box.replaceChildren(...(S.tags.length ? tagList().map(t=>h("button",{type:"button",class:"ttag",style:`--h:${t.hue??200}`,disabled:ro,"aria-pressed":String(arr(d.tags).includes(t.id)),
    onclick:()=>{ d.tags = arr(d.tags).includes(t.id) ? d.tags.filter(x=>x!==t.id) : [...arr(d.tags), t.id]; draw(); }}, t.name)) : [h("span",{class:"hint"},"Nenhuma tag cadastrada.")]));
  draw();
  return h("div",{class:"fld"}, h("span",null,"Tipo"), box);
}
const passTag = a => S.tagF==="all" || (S.tagF==="__none" ? !arr(a.tags).filter(tagOf).length : arr(a.tags).includes(S.tagF));
function openTags(){
  const dlg = $("#dlg");
  const HUES = [["Azul",205],["Verde",125],["Roxo",275],["Laranja",30],["Teal",175],["Rosa",330],["Amarelo",48],["Vermelho",0],["Índigo",235]];
  const rows = tagList().map((t,i)=>({id:t.id, name:t.name, hue:t.hue??200, order:t.order??i, orig:t}));
  const list = h("ul",{class:"tag-rows"});
  const draw = () => list.replaceChildren(...rows.filter(r=>!r.del).map(r=>h("li",null,
    h("input",{type:"text",value:r.name,placeholder:"Nome do tipo","aria-label":"Nome da tag",oninput:e=>r.name=e.target.value}),
    h("select",{"aria-label":"Cor da tag",onchange:e=>r.hue=+e.target.value}, HUES.map(([n,v])=>h("option",{value:v,selected:v===r.hue}, n))),
    h("button",{class:"btn danger",type:"button",onclick:()=>{ r.del=true; draw(); }},"Remover"))));
  draw();
  async function save(){
    const jobs=[];
    for(const r of rows){
      const name = r.name.trim();
      if(r.del){ if(r.orig) jobs.push(write("tags/"+r.id, ()=>db.doc("tags/"+r.id).delete())); continue; }
      if(!name) continue;
      if(!r.orig){ const id = slug(name)+"-"+Date.now().toString(36).slice(-4); jobs.push(write("tags/"+id, ()=>db.doc("tags/"+id).set({name, hue:r.hue, order:r.order}))); }
      else if(name!==r.orig.name || r.hue!==(r.orig.hue??200)) jobs.push(write("tags/"+r.id, ()=>db.doc("tags/"+r.id).update({name, hue:r.hue})));
    }
    const res = await Promise.all(jobs);
    if(res.every(Boolean)){ dlg.close(); toast("Tipos de ação atualizados."); }
  }
  dlg.replaceChildren(h("div",{class:"dlg"},
    h("div",{class:"dlg-h"}, h("h2",{id:"dlg-title"},"Tipos de ação"), h("button",{class:"btn ghost",type:"button","aria-label":"Fechar",onclick:()=>dlg.close()},"✕")),
    h("p",{class:"hint"},"As tags dizem para o que cada ação é voltada. Elas aparecem nos cards, no filtro do quadro e no acompanhamento dos times. Remover uma tag tira ela de todas as ações."),
    list,
    h("div",null, h("button",{class:"btn",type:"button",onclick:()=>{ rows.push({id:null,name:"",hue:205,order:rows.length}); draw(); const ins=list.querySelectorAll("input"); ins[ins.length-1].focus(); }},"Adicionar tipo")),
    h("div",{class:"dlg-f"}, h("button",{class:"btn",type:"button",onclick:()=>dlg.close()},"Cancelar"), h("button",{class:"btn primary",type:"button",onclick:save},"Salvar"))));
  dlg.showModal();
}
function sortActions(a,b){
  const la=isLate(a)?0:1, lb=isLate(b)?0:1; if(la!==lb) return la-lb;
  const da=a.due||"9999", dbb=b.due||"9999"; if(da!==dbb) return da.localeCompare(dbb);
  return (PRI_ORDER[a.priority]??1)-(PRI_ORDER[b.priority]??1);
}

let raf=0;
function schedule(){
  if(raf) return;
  raf = requestAnimationFrame(()=>{ raf=0; if(editingInMain()){ S.dirty=true; return; } render(); });
}
document.addEventListener("focusout", ()=>{ if(S.dirty) setTimeout(()=>{ if(!editingInMain()){ S.dirty=false; render(); } }, 0); });

function resolveNames(){
  if(!user) return;
  const ids=new Set();
  for(const a of S.actions){ for(const u of arr(a.updates)) if(u.by) ids.add(u.by); if(a.validatedBy) ids.add(a.validatedBy); }
  for(const t of Object.values(S.teams)) if(t.by) ids.add(t.by);
  const missing=[...ids].filter(id=>id!=="claude" && !S.asked.has(id));
  if(!missing.length) return;
  missing.forEach(id=>S.asked.add(id));
  user.profiles(missing).then(ps=>{ for(const id of missing) S.names[id]=(ps[id]&&ps[id].name)||""; schedule(); }).catch(()=>{});
}

  const log = h("ul",{class:"log"});
  const drawLog = (list) => log.replaceChildren(...(list.length ? list.slice().reverse().map(u=>h("li",null, h("div",{class:"who"}, `${personName(u.by)}, ${new Date(u.at).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}`), h("div",null,u.text))) : [h("li",{class:"hint"},"Nenhuma atualização registrada.")]));
  let localUpdates = isNew ? [] : arr(a.updates).slice();

      const ok = await write("actions/"+id, ()=>db.doc("actions/"+id).set({

/* ---------- AI: retro analysis ---------- */
function retroText(r, max=16000){
  const lines=[];
  for(const col of arr(r.columns)){
    lines.push(`## ${col.name}${col.description ? ` (${col.description})` : ""}`);
    for(const c of arr(col.cards)){
      lines.push(`- ${String(c.t).replace(/\s*\n\s*/g," / ")}${c.v ? ` [${c.v} votos]` : ""}`);
      for(const x of arr(c.c)) lines.push(`  ↳ comentário: ${x}`);
    }
  }
  let t = lines.join("\n"); if(t.length>max) t = t.slice(0,max)+"\n[…cortado]"; return t;
}

  const prompt = `Você ajuda a liderança de times de desenvolvimento de software a transformar retrospectivas em ações concretas.

Retro: ${r.title}

Colunas e cards (votos entre colchetes; "↳" são comentários do time):
${retroText(r)}

Ações que este time já tem (não repita nem crie variações delas):
${existing}

Tipos de ação disponíveis (use 1 ou 2 por ação, escritos exatamente como abaixo):
${tagList().map(t=>"- "+t.name).join("\n") || "(nenhum)"}

Responda somente com JSON neste formato:
{"resumo":"2 a 3 frases sobre o clima e os pontos centrais","temas":[{"tema":"rótulo curto","tom":"positivo|atencao|critico","detalhe":"1 frase"}],"elogios":["elogio curto com o nome de quem foi citado"],"acoes":[{"titulo":"começa com verbo no infinitivo, até 80 caracteres","detalhe":"o que fazer e como saber que foi feito, 1 a 2 frases","origem":["trecho curto do card que motivou"],"prioridade":"alta|media|baixa","responsavel":"nome citado nos cards como dono da ação, ou texto vazio","recorrente":false,"tags":["tipo da lista acima"]}]}
(Use "recorrente": true quando a ação for um hábito que o time precisa manter sempre, sem data de fim, como olhar um painel na daily.)

Regras: de 3 a 7 ações, pequenas o bastante para caber em duas semanas; dê prioridade a cards com votos, comentários e temas repetidos; não invente fatos nem nomes; ignore cards só de brincadeira; escreva em português do Brasil.`;

        priority:["alta","media","baixa"].includes(x.prioridade)?x.prioridade:"media", owner:String(x.responsavel||"").slice(0,80),
        due:"", recurring:x.recorrente===true || x.recorrente==="true", tags:arr(x.tags).map(n=>(S.tags.find(t=>norm(t.name)===norm(n))||{}).id).filter(Boolean).slice(0,3), state:"sugerida", source:"ia", team:r.team, retroId:r.id, createdAt:nowIso(), createdBy:S.myId||null, updates:[] }));

    byTag.length ? h("div",null, h("h3",{style:"margin-bottom:8px"},"Ações por tipo"), h("div",{class:"tbars"}, byTag.map(({t,n})=>h("div",{class:"tbar",style:`--h:${t.hue??200}`}, h("span",null,t.name), h("div",{class:"bar","aria-hidden":"true"}, h("i",{style:`width:${Math.round(n/maxTag*100)}%`})), h("b",null,n))))) : null,
    kudos.length ? h("div",null, h("h3",{style:"margin-bottom:8px"},"Elogios recentes"), h("ul",{class:"kudos"}, kudos.map(k=>h("li",null,k)))) : null,
    h("div",{class:"fb"},
      h("div",{class:"sec-head",style:"margin:0"}, h("h3",null,"Feedback para o time"),
        (sample && S.canWrite) ? h("button",{class:"btn",type:"button",disabled:!!busy,onclick:()=>teamFeedback(s,name)}, fb ? "Atualizar feedback" : "Gerar feedback") : null),
      fb && fb.feedback ? [
        h("p",{class:"fb-msg"}, fb.feedback.mensagem),
        h("div",{class:"fb-cols"},
          arr(fb.feedback.manter).length ? h("div",null, h("h3",null,"Manter"), h("ul",null, arr(fb.feedback.manter).map(x=>h("li",null,x)))) : null,
          arr(fb.feedback.melhorar).length ? h("div",null, h("h3",null,"Melhorar"), h("ul",null, arr(fb.feedback.melhorar).map(x=>h("li",null,x)))) : null),
        fb.feedback.proximo_passo ? h("p",null, h("strong",null,"Próximo passo: "), fb.feedback.proximo_passo) : null,
        h("p",{class:"by"}, `Gerado em ${new Date(fb.at).toLocaleDateString("pt-BR")}${fb.by?` por ${personName(fb.by)}`:""}`)
      ] : h("p",{class:"hint"}, sample ? "Gere um feedback a partir das retros e do andamento das ações deste time." : "O feedback por IA não está disponível nesta visita."),
      busy ? h("p",{class:"busy",role:"status"}, busy) : null));
}
async function teamFeedback(s, name){
  if(!sample || S.busy["team:"+s]) return;
  S.busy["team:"+s] = "A IA está preparando o feedback…"; render();
  const retros = S.retros.filter(r=>slug(r.team)===s).sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));
  const acts = S.actions.filter(a=>slug(a.team)===s && a.state!=="descartada");
  const rtxt = retros.map(r=>`### ${r.title} (${r.date||"sem data"})\n` + (r.insights && r.insights.resumo ? `Resumo: ${r.insights.resumo}\nTemas: ${arr(r.insights.temas).map(t=>`${t.tema} [${t.tom}]`).join("; ")}\n` : retroText(r, 4000))).join("\n\n").slice(0,18000);
  const atxt = acts.map(a=>`- ${a.title} | estado: ${STATE[a.state]} | tipo: ${arr(a.tags).map(id=>(tagOf(id)||{}).name).filter(Boolean).join(", ")||"sem tipo"} | responsável: ${a.owner||"nenhum"} | prazo: ${a.recurring ? "recorrente, sem data" : (a.due||"sem prazo")}${isLate(a)?" | ATRASADA":""} | atualizações: ${arr(a.updates).length}`).join("\n") || "(nenhuma ação)";
  const prompt = `Você é um agile coach escrevendo um feedback curto, honesto e respeitoso para o time "${name}", com base nas retrospectivas e no andamento das ações combinadas. Hoje é ${fmtDate(todayStr(),true)}.

Retrospectivas:
${rtxt}

Ações do time:
${atxt}

Responda somente com JSON:
{"mensagem":"um parágrafo de 3 a 5 frases dirigido ao time, reconhecendo o que vai bem e apontando o principal ponto de atenção","manter":["até 3 itens"],"melhorar":["até 3 itens"],"proximo_passo":"uma ação concreta para a próxima sprint"}

Escreva em português do Brasil, sem expor críticas a pessoas específicas e sem inventar fatos.`;
  try{
    const res = await sample.json(prompt, {modelTier:"default"});
    if(!res || typeof res!=="object") throw {code:"invalid_json"};
    const feedback = {mensagem:String(res.mensagem||"").slice(0,1500), manter:arr(res.manter).map(String).slice(0,3), melhorar:arr(res.melhorar).map(String).slice(0,3), proximo_passo:String(res.proximo_passo||"").slice(0,300)};
    const ok = await write("teams/"+s, ()=>db.doc("teams/"+s).set({name, feedback, at:nowIso(), by:S.myId||null}));
    if(ok) toast("Feedback do time atualizado.");
  }catch(e){ toast(sampleErr(e)); }
  finally{ delete S.busy["team:"+s]; render(); }
}

/* ---------- import ---------- */
function inferDate(str){
  const m = String(str).match(/(?<!\d)(\d{2})[\/\-_. ]?(\d{2})(?:[\/\-_. ](\d{2,4}))?(?!\d)/);
  if(!m) return "";
  const d=+m[1], mo=+m[2]; if(d<1||d>31||mo<1||mo>12) return "";
  let y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : new Date().getFullYear();
  let iso = `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  if(!m[3] && iso > todayStr()){ y--; iso = `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
  return iso;
}
function inferTeam(title){
  const t = norm(title);
  for(const [,n] of teamList()) if(t.includes(norm(n))) return n;
  let s = String(title).replace(/(?<!\d)\d{2}[\/\-_. ]?\d{2}(?:[\/\-_. ]\d{2,4})?(?!\d)/,"").replace(/easyretro/i,"").replace(/[\s\-_–|:]+$/,"").replace(/^[\s\-_–|:]+/,"").trim();
  return s || "Sem time";
}
function parseCard(raw){
  let text = String(raw).replace(/\r/g,""); let comments=[]; let votes=0;
  const ci = text.search(/\s+Comments\s+-\s/);
  if(ci>=0){ const ctext = text.slice(ci).replace(/^\s+Comments\s+/,""); text = text.slice(0,ci); comments = ctext.split(/(?:^|\s{2,})-\s+/).map(s=>s.trim()).filter(Boolean); }
  const vm = text.match(/\s*\((\d+) votes?\)\s*$/i); if(vm){ votes=+vm[1]; text=text.slice(0,vm.index); }
  text = text.replace(/\s+---\s+/g,"\n---\n").trim();
  return {t:text, v:votes, c:comments};
}
function parseRows(rows, filename){
  rows = rows.map(r=>arr(r).map(c=>c==null?"":String(c)));
  const title = ((rows[0]||[]).find(c=>c.trim()) || filename.replace(/\.[^.]+$/,"")).trim();
  let hi = rows.findIndex((r,i)=>i>0 && r.filter(c=>c.trim()).length>=2);
  if(hi<0) hi = rows.length>1 ? 1 : 0;
  const headers = rows[hi] || [];
  let start = hi+1, descs=[];
  if(rows[start] && rows[start].some(c=>/^\s*Description:/i.test(c))){ descs = rows[start].map(c=>c.replace(/^\s*Description:\s*/i,"").trim()); start++; }
  const width = Math.max(headers.length, ...rows.slice(start).map(r=>r.length));
  const cols = Array.from({length:width},(_,i)=>({name:(headers[i]||"").trim(), description:descs[i]||"", cards:[]}));
  for(const r of rows.slice(start)) r.forEach((cell,i)=>{ if(cell.trim()) cols[i].cards.push(parseCard(cell)); });
  const columns = cols.filter(c=>c.name || c.cards.length).map((c,i)=>({...c, name:c.name||`Coluna ${i+1}`}));
  return {title, columns};
}
async function parseSheet(file){
  await loadScript(XLSX_SRC);
  const wb = XLSX.read(await file.arrayBuffer(), {type:"array"});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false, blankrows:true});
  return parseRows(rows, file.name);
}
async function pdfLines(file){
  await loadScript(PDF_SRC); await loadScript(PDFW_SRC);
  const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = PDFW_SRC;
  const pdf = await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()), isEvalSupported:false}).promise;
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p); const tc = await page.getTextContent();
    const rows=[];
    for(const it of tc.items){
      if(!it.str || !it.str.trim()) continue;
      const y=it.transform[5], x=it.transform[4], hh=Math.abs(it.transform[3])||it.height||0;
      let row = rows.find(r=>Math.abs(r.y-y)<=2); if(!row){ row={y,items:[],h:0}; rows.push(row); }
      row.items.push({x, w:it.width||0, s:it.str}); row.h=Math.max(row.h,hh);
    }
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){
      r.items.sort((a,b)=>a.x-b.x); let t="", end=null;
      for(const i of r.items){ if(end!==null && i.x-end>1 && !t.endsWith(" ") && !i.s.startsWith(" ")) t+=" "; t+=i.s; end=i.x+i.w; }
      t=t.replace(/\s+/g," ").trim(); if(t) out.push({t, h:Math.round(r.h*10)/10});
    }
  }
  return out;
}
function pdfHeuristic(lines, filename){
  const L = lines.filter(l=>!/^Gerado\s/i.test(l.t) && !/^Easy\s?Retro$/i.test(l.t));
  const title = (L[0] && L[0].t) || filename;
  const ci = L.findIndex(l=>l.t==="Cards");
  const body = L.slice(ci>=0 ? ci+1 : 1);
  const hs = body.map(l=>l.h).sort((a,b)=>a-b); const med = hs[Math.floor(hs.length/2)] || 10;
  const cols=[]; let cur=null, expectDesc=false;
  for(const l of body){
    if(l.h > med*1.18 && l.t.length<70){ cur={name:l.t.replace(/^[^\p{L}\p{N}]+/u,"").trim(), description:"", cards:[]}; cols.push(cur); expectDesc=true; continue; }
    if(!cur){ cur={name:"Cards",description:"",cards:[]}; cols.push(cur); }
    if(/^\d{1,3}$/.test(l.t)){ const last=cur.cards[cur.cards.length-1]; if(last) last.v=Math.max(last.v,+l.t); continue; }
    if(expectDesc){ cur.description=l.t; expectDesc=false; continue; }
    cur.cards.push({t:l.t, v:0, c:[]});
  }
  return {title, columns:cols.filter(c=>c.cards.length||c.name)};
}
async function parsePdf(file, item){
  const lines = await pdfLines(file);
  if(!lines.length) throw new Error("O PDF não tem texto legível (pode ser uma imagem escaneada).");
  if(sample){
    item.status="lendo"; item.note="Organizando o PDF com a IA…"; drawImport();
    const text = lines.map(l=>l.t).join("\n").slice(0,30000);
    const prompt = `Este é o texto extraído de um PDF exportado do EasyRetro (uma retrospectiva ágil). A ordem é: título do quadro, "Gerado <data>", "Sumário" com contadores (ignore), "Cards" e então cada coluna: o nome da coluna, uma linha de descrição da coluna e os cards dela, um por vez. Um número solto (como 1 ou 2) logo depois de um card é a contagem de votos ou de comentários daquele card. Quando há contagem de comentários, as linhas seguintes que respondem ao card são comentários dele. Linhas "---" juntam cards mesclados: mantenha tudo num único card, com "\\n---\\n" entre as partes. Um card pode ocupar várias linhas: junte as linhas de um mesmo card.

Texto:
${text}

Responda somente com JSON: {"title":"título do quadro","columns":[{"name":"nome da coluna","description":"descrição da coluna","cards":[{"t":"texto do card","v":0,"c":["comentário"]}]}]}
Em "v" ponha os votos (0 se não souber se o número era voto ou comentário e não houver comentário depois). Não invente nem resuma: copie o texto dos cards.`;
    try{
      const res = await sample.json(prompt, {modelTier:"default"});
      if(res && Array.isArray(res.columns) && res.columns.length){
        return {title:String(res.title||lines[0].t), columns:res.columns.map((c,i)=>({name:String(c.name||`Coluna ${i+1}`), description:String(c.description||""), cards:arr(c.cards).map(k=>({t:String(k.t||"").trim(), v:Math.max(0,parseInt(k.v)||0), c:arr(k.c).map(String).filter(Boolean)})).filter(k=>k.t)})), via:"ia"};
      }
    }catch(e){ item.note = sampleErr(e); }
  }
  const out = pdfHeuristic(lines, file.name); out.via="estimado"; return out;
}
function openImport(){
  S.imp = {items:[], ai: !!sample, saving:false};
  drawImport(); $("#dlg").showModal();
}
function drawImport(){
  const I = S.imp; if(!I) return; const dlg=$("#dlg");
  const okItems = I.items.filter(i=>i.status==="ok");
  const input = h("input",{type:"file",multiple:true,accept:".xlsx,.xls,.csv,.pdf",class:"sr",onchange:e=>{handleFiles(e.target.files); e.target.value="";}});
  const drop = h("label",{class:"drop",
      ondragover:e=>{e.preventDefault(); drop.classList.add("over");}, ondragleave:()=>drop.classList.remove("over"),
      ondrop:e=>{e.preventDefault(); drop.classList.remove("over"); handleFiles(e.dataTransfer.files);}},
    input, h("strong",null,"Escolher arquivos"), " ou arraste para cá", h("div",{class:"hint",style:"margin-top:6px"},"Excel (.xlsx) ou PDF exportados do EasyRetro"));
  dlg.replaceChildren(h("div",{class:"dlg"},
    h("div",{class:"dlg-h"}, h("h2",{id:"dlg-title"},"Importar retrospectivas"), h("button",{class:"btn ghost",type:"button","aria-label":"Fechar",onclick:()=>dlg.close()},"✕")),
    h("p",{class:"hint"},"No EasyRetro, abra o quadro e exporte em Excel (melhor) ou PDF. Confira o time e a data antes de salvar."),
    drop,
    I.items.length ? h("ul",{class:"imp-list"}, I.items.map(impItem)) : null,
    h("div",{class:"dlg-f"},
      sample ? h("label",{class:"check left"}, h("input",{type:"checkbox",checked:I.ai,onchange:e=>I.ai=e.target.checked}), "Gerar leitura e sugestões de ação com IA ao salvar") : h("span",{class:"left"}),
      h("button",{class:"btn",type:"button",onclick:()=>dlg.close()},"Cancelar"),
      h("button",{class:"btn primary",type:"button",disabled:!okItems.length||I.saving,onclick:saveImport}, I.saving ? "Salvando…" : okItems.length>1 ? `Salvar ${okItems.length} retros` : "Salvar retro"))));
}
function impItem(it){
  const I=S.imp;
  if(it.status==="lendo") return h("li",{class:"imp"}, h("strong",null,it.file), h("span",{class:"hint"}, it.note || "Lendo arquivo…"));
  if(it.status==="erro") return h("li",{class:"imp"}, h("strong",null,it.file), h("span",{class:"err"}, `Não consegui ler este arquivo: ${it.err}`), h("div",null,h("button",{class:"btn ghost",type:"button",onclick:()=>{I.items=I.items.filter(x=>x!==it); drawImport();}},"Remover")));
  const st = statsOf(it.columns);
  const dup = S.retros.some(r=>slug(r.team)===slug(it.team) && (r.date===it.date && it.date || norm(r.title)===norm(it.title)));
  return h("li",{class:"imp"},
    h("div",{class:"sug-meta"}, h("strong",null,it.file), h("span",{class:"hint"}, `${it.columns.length} colunas, ${st.cards} cards, ${st.votes} votos`)),
    h("div",{class:"imp-row"},
      field("Time", h("input",{type:"text",list:"dl-teams",value:it.team,oninput:e=>it.team=e.target.value})),
      field("Título", h("input",{type:"text",value:it.title,oninput:e=>it.title=e.target.value})),
      field("Data", h("input",{type:"date",value:it.date,oninput:e=>it.date=e.target.value})),
      h("button",{class:"btn ghost",type:"button",onclick:()=>{I.items=I.items.filter(x=>x!==it); drawImport();}},"Remover")),
    h("div",{class:"cols"}, it.columns.map((c,i)=>h("span",{class:"mini-note",style:`background:var(--n${i%5})`}, `${c.name} (${c.cards.length})`))),
    it.via==="estimado" ? h("p",{class:"warn"},"Colunas estimadas sem IA. Confira se os cards estão nas colunas certas; se possível, use a exportação em Excel.") : null,
    it.note && it.via==="estimado" ? h("p",{class:"warn"}, it.note) : null,
    dup ? h("p",{class:"warn"},"Já existe uma retro parecida deste time. Salvar cria outra cópia.") : null);
}
async function handleFiles(list){
  const I=S.imp; if(!I) return;
  for(const file of [...list]){
    const it = {file:file.name, status:"lendo"}; I.items.push(it); drawImport();
    try{
      const ext = file.name.split(".").pop().toLowerCase();
      let parsed;
      if(["xlsx","xls","csv","xlsm"].includes(ext)) parsed = await parseSheet(file);
      else if(ext==="pdf") parsed = await parsePdf(file, it);
      else throw new Error("formato não suportado. Use .xlsx ou .pdf.");
      if(!parsed.columns.length || !statsOf(parsed.columns).cards) throw new Error("não encontrei cards no arquivo.");
      const base = `${parsed.title} ${file.name}`;
      Object.assign(it, {status:"ok", title:parsed.title, columns:parsed.columns, via:parsed.via, team:inferTeam(parsed.title), date:inferDate(parsed.title) || inferDate(file.name)});
    }catch(e){ it.status="erro"; it.err = (e && e.message) || "erro desconhecido"; }
    drawImport();
  }
}
async function saveImport(){
  const I=S.imp; I.saving=true; drawImport();
  const saved=[];
  for(const it of I.items.filter(x=>x.status==="ok")){
    const team = (it.team||"").trim() || "Sem time";
    const id = newId(team+"-"+(it.date||"retro"));
    const doc = {team, title:(it.title||"").trim()||it.file, date:it.date||"", source:it.file, columns:it.columns, stats:statsOf(it.columns), insights:null, createdAt:nowIso(), createdBy:S.myId||null};
    const ok = await write("retros/"+id, ()=>db.doc("retros/"+id).set(doc));
    if(ok) saved.push({id, ...doc});
  }
  const ai = I.ai; S.imp=null; $("#dlg").close();
  if(!saved.length) return;
  toast(saved.length>1 ? `${saved.length} retros importadas.` : "Retro importada.");
  location.hash = saved.length===1 ? "#retro-"+saved[0].id : "#retros";
  if(ai && sample) for(const r of saved) await analyzeRetro(r);
}

/* ---------- routing & boot ---------- */
function route(){
  const hs = decodeURIComponent(location.hash.slice(1));
  if(hs.startsWith("retro-")){ S.view="retro"; S.openRetro=hs.slice(6); }
  else { S.view = ["acoes","retros","times"].includes(hs) ? hs : "acoes"; }
  render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
$("#btnImport").addEventListener("click", openImport);
$("#dlg").addEventListener("close", ()=>{ S.imp=null; });

async function boot(){
  route();
  if(!window.claude || typeof window.claude.use!=="function"){ S.noDb=true; S.loading=false; render(); return; }
  const [d,u,s] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("sample")]);
  db=d; user=u; sample=s;
  if(user){
    try{ S.canValidate = await user.canEdit(); }catch(e){}
    try{ const w = await user.can("data.write"); S.canWrite = w!==false; }catch(e){}
    try{ S.myId = await user.id(); }catch(e){}
  }
  if(!db){ S.noDb=true; S.loading=false; render(); return; }
  const timer = setTimeout(()=>{ if(S.loading){ S.stale=true; schedule(); } }, 10000);
  const done = () => { if(S.ready.retros && S.ready.actions && S.ready.teams){ S.loading=false; S.stale=false; clearTimeout(timer); } };
  db.collection("retros").onSnapshot(snap=>{ S.retros = snap.docs.map(x=>({id:x.id, ...x.data()})); if(!snap.metadata.fromCache) S.ready.retros=true; done(); schedule(); }, ()=>{ S.ready.retros=true; done(); schedule(); });
  db.collection("actions").onSnapshot(snap=>{ S.actions = snap.docs.map(x=>({id:x.id, ...x.data()})); if(!snap.metadata.fromCache) S.ready.actions=true; done(); schedule(); }, ()=>{ S.ready.actions=true; done(); schedule(); });
  db.collection("teams").onSnapshot(snap=>{ const m={}; for(const x of snap.docs) m[x.id]=x.data(); S.teams=m; if(!snap.metadata.fromCache) S.ready.teams=true; done(); schedule(); }, ()=>{ S.ready.teams=true; done(); schedule(); });
  db.collection("tags").onSnapshot(snap=>{ S.tags = snap.docs.map(x=>({id:x.id, ...x.data()})); schedule(); }, ()=>{});
  render();
}
boot();
